<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>saloon junkie</title>
    <link rel="icon" href="./media/favicon.ico">
    <link rel="stylesheet" href="style.css" />.
</head>

<body>
    <div class="main-container">
        <h1>saloon jukebox</h1>
        <p>drop a link to queue up a track</p>

        <!--inputform -->
        <div>
            <input type="text" id="songInput" placeholder="paste mp3 or audio url here...">
            <button id="addBtn">add</button>
        </div>
        <div style="margin-top: 10px;">
            <button id="pauseBtn">play/pause</button>
            <button id="skipBtn">skip</button>
            <button id="clearBtn" style="background:#cc3333; color:#fff;">clear queue</button>
        </div>
        <div style="margin-top: 10px; font-size: 12px;">
            <span>quick add:</span>
            <button onclick="addPreset('./media/irideanoldpaint.mp3', 'i ride an old paint')">i ride an old paint</button>
            <button onclick="addPreset('./media/nightherdingsong.mp3', 'night herding song')">night herding song</button>
        </div>

        <h3>current queue:</h3>
        <div id="queueList">
            <!--items go here-->
        </div>
    </div>
    <script src="script.js"></script>
</body>
